<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delcrat Music Admin</title>
<style>
body{background:#101010;color:white;font-family:Arial;padding:20px}
h1,h2{color:#eeb400}
.box{background:#222;padding:18px;border-radius:12px;margin:20px 0}
input,button{width:100%;padding:13px;margin:9px 0;box-sizing:border-box}
input{background:#111;color:white;border:1px solid #555;border-radius:6px}
button{background:#eeb400;border:0;border-radius:6px;font-weight:bold}
.song{background:#303030;padding:12px;margin:10px 0;border-radius:8px}
.song img{width:75px;height:75px;object-fit:cover}
audio{width:100%;margin-top:8px}
#message{color:#eeb400}
</style>
</head>
<body>

<h1>DELCRAT MUSIC</h1>
<h2>ADMIN DASHBOARD</h2>
<p>Welcome, Administrator.</p>

<div class="box">
<h2>UPLOAD NEW SONG</h2>

<form id="uploadForm">
<label>Song title</label>
<input name="title" placeholder="Enter song title" required>

<label>Artist name</label>
<input name="artist" placeholder="Enter artist name" required>

<label>MP3 song file</label>
<input name="audio" type="file" accept=".mp3,.wav,.m4a,.aac,.ogg,.flac,.wma,.mp4,.mov,.mkv,.webm,.avi,audio/*,video/*" required>

<label>Song cover photo (optional)</label>
<input name="cover" type="file" accept=".jpg,.jpeg,.png,.webp,image/*">

<button type="submit">UPLOAD SONG</button>
</form>

<p id="message"></p>
</div>

<div class="box">
<h2>YOUR MUSIC LIBRARY</h2>
<div id="songs">Loading songs...</div>
<button onclick="loadSongs()">REFRESH SONG LIST</button>
</div>

<button onclick="logout()">LOG OUT</button>

<script>
const form=document.getElementById('uploadForm');

form.addEventListener('submit',async e=>{
 e.preventDefault();

 const message=document.getElementById('message');
 message.textContent='Uploading song... Please wait.';

 try{
  const response=await fetch('/api/admin/songs',{
   method:'POST',
   body:new FormData(form)
  });

  const raw=await response.text();
  let data={};
  try {
   data=JSON.parse(raw);
  } catch {
   data={message:raw || 'Unexpected server response.'};
  }

  if(!response.ok){
   message.textContent=data.message || 'Upload failed.';
   return;
  }

  message.textContent=data.message;
  form.reset();
  loadSongs();

 }catch(error){
  message.textContent='Connection error. Please try again.';
 }
});

async function loadSongs(){
 const area=document.getElementById('songs');

 try{
  const response=await fetch('/api/admin/songs');
  if(!response.ok){
   area.textContent='Could not load songs. Please log in again.';
   return;
  }

  const songs=await response.json();
  area.innerHTML='';

  if(!songs.length){
   area.textContent='No songs uploaded yet.';
   return;
  }

  songs.forEach(song=>{
   const item=document.createElement('div');
   item.className='song';

   const title=document.createElement('strong');
   title.textContent=song.title+' - '+song.artist;
   item.appendChild(title);

   if(song.cover){
    const img=document.createElement('img');
    img.src=song.cover;
    img.alt='Song cover';
    item.appendChild(document.createElement('br'));
    item.appendChild(img);
   }

   const isVideo = song.mediaType === 'video' ||
     /\.(mp4|mov|mkv|webm|avi)$/i.test(song.audio);

   const player = document.createElement(isVideo ? 'video' : 'audio');
   player.controls = true;
   player.preload = 'none';
   player.src = song.audio;

   if (isVideo) {
     player.playsInline = true;
     player.style.width = '100%';
     player.style.maxWidth = '500px';
   }

   item.appendChild(player);

   const removeButton = document.createElement('button');
   removeButton.textContent = 'DELETE SONG';
   removeButton.style.background = '#b3261e';
   removeButton.style.color = 'white';
   removeButton.addEventListener('click', async () => {
    if (!confirm('Are you sure you want to delete this song?')) return;

    try {
     const result = await fetch('/api/admin/songs/' + encodeURIComponent(song.id), {
      method: 'DELETE'
     });
     const data = await result.json();

     if (!result.ok) {
      alert(data.message || 'Could not delete song.');
      return;
     }

     alert(data.message);
     loadSongs();
    } catch (error) {
     alert('Connection error. Song was not deleted.');
    }
   });
   item.appendChild(removeButton);

   area.appendChild(item);
  });

 }catch(error){
  area.textContent='Could not connect to server.';
 }
}

async function logout(){
 await fetch('/api/admin/logout',{method:'POST'});
 location.href='/admin/login';
}

loadSongs();
</script>
</body>
</html>
